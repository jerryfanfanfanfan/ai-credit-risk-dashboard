name: Weekly data refresh

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/weekly-update.yml"
      - "scripts/update_data.py"
      - "config/metrics.json"
      - "config/refresh.json"
      - "tests/**"
  schedule:
    # Sunday 20:00 Asia/Shanghai (12:00 UTC).
    - cron: "0 12 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEC_USER_AGENT: jerryfanfanfanfan ai-credit-risk-dashboard jerryfanfanfanfan@users.noreply.github.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run updater tests
        run: python3 -m unittest discover -s tests -v

      - name: Refresh public data
        run: python3 scripts/update_data.py --strict-public

      - name: Commit refreshed cache
        run: |
          if git diff --quiet -- dashboard/data/metrics.json data/cache/latest_metrics.json; then
            echo "No dashboard data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/metrics.json data/cache/latest_metrics.json
          git commit -m "chore: weekly data refresh"
          git push

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out refreshed repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
